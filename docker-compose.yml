name: payflow

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - payflow_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-payflow} -d ${POSTGRES_DB:-payflow}',
        ]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8.8.1-alpine
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - payflow_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
      ALIPAY_ALLOW_PRODUCTION: ${ALIPAY_ALLOW_PRODUCTION:-false}
      ALIPAY_ALIPAY_PUBLIC_CERT_CONTENT: ${ALIPAY_ALIPAY_PUBLIC_CERT_CONTENT:-}
      ALIPAY_ALIPAY_ROOT_CERT_CONTENT: ${ALIPAY_ALIPAY_ROOT_CERT_CONTENT:-}
      ALIPAY_APP_CERT_CONTENT: ${ALIPAY_APP_CERT_CONTENT:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_APP_PRIVATE_KEY: ${ALIPAY_APP_PRIVATE_KEY:-}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_ENV: ${ALIPAY_ENV:-sandbox}
      ALIPAY_GATEWAY_URL: ${ALIPAY_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-http://localhost:4000/webhooks/alipay}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-http://localhost:3000/payments/{paymentId}/result?provider=alipay}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:-payflow}@postgres:5432/${POSTGRES_DB:-payflow}?schema=public
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-900}
      JWT_SECRET: ${JWT_SECRET:-payflow-sandbox-jwt-secret-change-before-production-2026}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRICS_HOST: 0.0.0.0
      OTEL_METRICS_PORT: 9464
      OTEL_SERVICE_NAME: payflow-api
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.11.0}
      PAYFLOW_ADMIN_EMAIL: ${PAYFLOW_ADMIN_EMAIL:-admin@payflow.local}
      PAYFLOW_ADMIN_PASSWORD: ${PAYFLOW_ADMIN_PASSWORD:-Payflow-Sandbox-Admin-2026!}
      PORT: 4000
      REDIS_URL: redis://redis:6379
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: sandbox
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - '${API_PORT:-4000}:4000'
      - '127.0.0.1:${API_METRICS_PORT:-9464}:9464'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      ALIPAY_ALLOW_PRODUCTION: ${ALIPAY_ALLOW_PRODUCTION:-false}
      ALIPAY_ALIPAY_PUBLIC_CERT_CONTENT: ${ALIPAY_ALIPAY_PUBLIC_CERT_CONTENT:-}
      ALIPAY_ALIPAY_ROOT_CERT_CONTENT: ${ALIPAY_ALIPAY_ROOT_CERT_CONTENT:-}
      ALIPAY_APP_CERT_CONTENT: ${ALIPAY_APP_CERT_CONTENT:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_APP_PRIVATE_KEY: ${ALIPAY_APP_PRIVATE_KEY:-}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_ENV: ${ALIPAY_ENV:-sandbox}
      ALIPAY_GATEWAY_URL: ${ALIPAY_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-http://localhost:4000/webhooks/alipay}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-http://localhost:3000/payments/{paymentId}/result?provider=alipay}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:-payflow}@postgres:5432/${POSTGRES_DB:-payflow}?schema=public
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRICS_HOST: 0.0.0.0
      OTEL_METRICS_PORT: 9465
      OTEL_SERVICE_NAME: payflow-worker
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.11.0}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: sandbox
      REDIS_URL: redis://redis:6379
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      INBOX_POLL_INTERVAL_MS: ${INBOX_POLL_INTERVAL_MS:-500}
      OUTBOX_WORKER_CONCURRENCY: ${OUTBOX_WORKER_CONCURRENCY:-4}
      PAYMENT_RECOVERY_INTERVAL_MS: ${PAYMENT_RECOVERY_INTERVAL_MS:-15000}
      RECONCILIATION_INTERVAL_MS: ${RECONCILIATION_INTERVAL_MS:-900000}
      RECONCILIATION_LOOKBACK_MS: ${RECONCILIATION_LOOKBACK_MS:-86400000}
      STRIPE_RECONCILIATION_KEY: ${STRIPE_RECONCILIATION_KEY:-}
      WEBHOOK_WORKER_CONCURRENCY: ${WEBHOOK_WORKER_CONCURRENCY:-8}
    ports:
      - '127.0.0.1:${WORKER_METRICS_PORT:-9465}:9465'
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-4000}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s
    restart: unless-stopped

volumes:
  payflow_postgres_data:
  payflow_redis_data:
