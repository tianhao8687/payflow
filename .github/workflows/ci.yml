name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'codex/**'

permissions:
  contents: read

env:
  APP_BASE_URL: http://localhost:3000
  DATABASE_URL: postgresql://payflow:payflow@localhost:5432/payflow?schema=public
  JWT_EXPIRES_IN_SECONDS: 900
  JWT_SECRET: payflow-ci-jwt-secret-not-for-production-2026
  PAYFLOW_ADMIN_EMAIL: admin@payflow.local
  PAYFLOW_ADMIN_PASSWORD: Payflow-CI-Admin-2026!

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: payflow
          POSTGRES_PASSWORD: payflow
          POSTGRES_USER: payflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply database migrations and seed
        run: pnpm db:migrate:deploy && pnpm db:seed

      - name: Stage 5 API end-to-end test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
